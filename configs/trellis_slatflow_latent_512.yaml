defaults:
  - dataset@trainer.dataset: mesh_512
  - model@trainer.model: trellis_slatflow_shapecond
  - trainer: trellis_latent_slatflow_trainer
  - _self_

output_folder: trellis_slatflow_latent_512
trainer:
  model_ckpt: checkpoints/flow_model.safetensors
  nvv_vae_ckpt: checkpoints/nvv_vae.safetensors
  sdf_vae_ckpt: checkpoints/sdf_vae.safetensors

hydra:
  run:
    dir: outputs/${hydra.job.name}/${output_folder}/${now:%Y-%m-%d_%H-%M-%S}
