defaults:
  - dataset@trainer.dataset: mesh_512
  - model@trainer.model: direct3ds2_sparse_vae
  - trainer: direct3ds2_sparse_vae_trainer
  - _self_

output_folder: direct3ds2_sparse_nvv_vae_512
trainer:
  model_ckpt: checkpoints/nvv_vae.safetensors
  batch_size_per_gpu: 2
  metrics_func:
    _target_: triflow.callbacks.nvv_vae.Metrics
  pre_process_data:
    _target_: triflow.callbacks.nvv_vae.NVVPreProcess
  post_process_recon:
    _target_: triflow.callbacks.nvv_vae.NVVPostProcess
  loss_func:
    _target_: triflow.callbacks.nvv_vae.NVVLoss
    kl_weight: 0.001
  model:
    in_channels: 14
    out_channels: 4
    model_channels_decoder: 1024
    decoder_channel_down_factors: [2, 4, 4]
    attn_mode: swin

hydra:
  run:
    dir: outputs/${hydra.job.name}/${output_folder}/${now:%Y-%m-%d_%H-%M-%S}
